model:
  id: mistralai/Mistral-7B-Instruct-v0.2

dataset:
  hf_repo: DiegoDomLarr/breast-cancer-qa
  split: train

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj

training:
  output_dir: /content/drive/MyDrive/FineTuneBreastCancer/adapter
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_seq_length: 512
  save_steps: 50
  logging_steps: 10
  fp16: true

hub:
  adapter_repo: DiegoDomLarr/mistral-7b-breast-cancer-qlora
